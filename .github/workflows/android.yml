name: Android verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - name: Compile, test, and verify a disposable signed APK
        shell: pwsh
        env:
          YUMINA_ANDROID_DATA_DIR: ${{ runner.temp }}/yumina-android-data
          YUMINA_ANDROID_OUTPUT_DIR: ${{ runner.temp }}/yumina-android-downloads
        run: python build.py
